- type: entity
  save: false
  name: Urist McZap
  parent: BaseMobEthereal
  id: MobEthereal

- type: entity
  save: false
  parent: BaseStructure
  categories: [ HideSpawnMenu ]
  id: MobEtherealCrystal
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    loop: false
    sprite: _Misfit/Mobs/Species/Ethereal/ethereal_crystal.rsi
    state: ethereal_crystal_forming
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
        - Opaque
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Muted
  - type: EtherealCrystal
    damageOnRevive:
      types:
        Cellular: 75
